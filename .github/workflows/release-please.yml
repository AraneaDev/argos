name: Release Please

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '**/docs/**'
      - 'test/**'
      - 'tests/**'
      - '**/test/**'
      - '**/tests/**'
      - '**/*.test.*'
      - '**/*.spec.*'
      - '.github/**'
      - 'release-please-config.json'
  # release-please only ever runs on a push to main, so a release PR that goes
  # stale, or a run that failed, has no way back without a new commit. This
  # gives it one.
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  id-token: write

# One run per branch. A second push cancels the first, because whoever pushed
# again has already answered the question the running job was asked. The runs
# long enough to be overtaken are the expensive ones, so this is worth more
# than the share of runs it cancels suggests.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    name: Release PR + tag/release on merge
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      # Opens/updates the Release PR from Conventional Commits. On merge of that
      # PR, creates the vX.Y.Z tag + GitHub Release and sets release_created=true.
      #
      # RELEASE_PLEASE_TOKEN is used when it exists. GitHub does not start
      # workflows for events raised by the built-in GITHUB_TOKEN, so a Release
      # PR opened with it arrives with no checks on it, and main requires those
      # checks before anything can be merged. A personal access token raises
      # the event as a real account, so CI runs on the Release PR by itself.
      #
      # Without the secret this still works; the Release PR then has to be
      # closed and reopened once to start its checks.
      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@v5
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # Everything below runs ONLY on the merge that cut a release. Because the
      # tag/release are made with GITHUB_TOKEN, no separate tag-triggered
      # workflow would fire — so build/verify/publish live here instead.
      - name: Checkout
        if: ${{ steps.release.outputs.release_created }}
        uses: actions/checkout@v7

      - name: Setup Node.js
        if: ${{ steps.release.outputs.release_created }}
        uses: actions/setup-node@v7
        with:
          node-version: 22.x
          cache: npm
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        if: ${{ steps.release.outputs.release_created }}
        run: npm ci

      - name: Build
        if: ${{ steps.release.outputs.release_created }}
        run: npm run build

      - name: Lint
        if: ${{ steps.release.outputs.release_created }}
        run: npm run lint:check

      - name: Format check
        if: ${{ steps.release.outputs.release_created }}
        run: npm run format:check

      - name: Typecheck
        if: ${{ steps.release.outputs.release_created }}
        run: npm run type-check

      - name: Test
        if: ${{ steps.release.outputs.release_created }}
        run: npm test

      # The MCP server speaks JSON-RPC on stdio and never exits on its own, so
      # it cannot be smoke-tested by running it. Assert the shipped artifacts
      # instead: every bin target exists and the `argos` entry keeps its shebang,
      # which is what makes `claude mcp add argos -- node dist/cli.js serve` work.
      - name: Verify release artifacts
        if: ${{ steps.release.outputs.release_created }}
        run: |
          test -f dist/cli.js
          test -f dist/index.js
          test -f dist/setup.js
          head -n 1 dist/cli.js | grep -qF '#!/usr/bin/env node'

      - name: Package release assets
        if: ${{ steps.release.outputs.release_created }}
        run: |
          npm pack
          zip -r "argos-${{ steps.release.outputs.tag_name }}.zip" \
            dist package.json README.md CHANGELOG.md

      - name: Attach assets to the GitHub Release
        if: ${{ steps.release.outputs.release_created }}
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.release.outputs.tag_name }}
          files: |
            argos-mcp-*.tgz
            argos-*.zip

      # Pre-release: not on npm yet. Intentionally dormant. To go public:
      # remove `if: false` and set up auth (Trusted Publishing / OIDC, or NPM_TOKEN).
      - name: Publish to npm (provenance)
        if: false
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
