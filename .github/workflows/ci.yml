name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# One run per branch. A second push cancels the first, because whoever pushed
# again has already answered the question the running job was asked. The runs
# long enough to be overtaken are the expensive ones, so this is worth more
# than the share of runs it cancels suggests.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'pull_request_target' }}

jobs:
  check:
    name: Lint, Format & Types
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Each stage runs with `if: always()` so a lint failure does not hide a
      # separate formatting or type error — all three are reported in one run.
      - name: Lint
        run: npm run lint:check

      - name: Format check
        if: always()
        run: npm run format:check

      - name: Typecheck
        if: always()
        run: npm run type-check

      # The root tsconfig excludes tests so `tsc` emits only src into dist, which
      # left the suite checked by nothing: @swc/jest strips types without
      # checking them, and `eslint src/**/*.ts` does not reach tests either.
      - name: Typecheck tests
        if: always()
        run: npm run type-check:tests

      # examples/ was covered by no tsconfig either, which is how the adapter
      # template the docs tell contributors to copy came to have imports that
      # did not resolve.
      - name: Typecheck examples
        if: always()
        run: npm run type-check:examples

  test:
    name: Test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # publishes the coverage badge to the gh-pages branch
    strategy:
      fail-fast: false
      matrix:
        node-version: [22.x, 24.x]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test with coverage
        run: npm run test:coverage

      # Self-hosted coverage badge: the percentage is published as a shields endpoint on an
      # orphan `gh-pages` branch, force-pushed so it stays a single commit and never grows
      # history. Gated to one matrix entry (the numbers do not differ by Node version) and to
      # main, because a pull request must not be able to move the badge.
      - name: Publish coverage badge
        if: matrix.node-version == '22.x' && github.ref == 'refs/heads/main'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/badge
          node scripts/coverage-badge.mjs > /tmp/badge/coverage.json
          cat /tmp/badge/coverage.json
          cd /tmp/badge
          git init -q
          git checkout -q -b gh-pages
          git add coverage.json
          git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -q -m 'chore: publish coverage badge'
          git push -q --force \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages

      - name: Upload coverage artifact
        if: matrix.node-version == '22.x'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage/

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [check, test]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # The bin entries in package.json point at these files. A build that
      # silently stops emitting one of them would ship a broken `claude mcp add`
      # target, so assert they exist and that the `argos` entry is executable.
      - name: Verify dist output
        run: |
          test -x dist/cli.js
          test -f dist/index.js
          test -f dist/setup.js
          test -x dist/index.js

      - name: Verify docs stay in sync with the released version
        run: npm run validate-docs
